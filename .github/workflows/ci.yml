# CI without any container runtime (the project does not use Docker).
#  - GitHub-hosted jobs: everything that needs no SIEM/IDS engine (runner OS is irrelevant to the target host).
#  - Engine jobs (suricata -T, wazuh-logtest) run on a SELF-HOSTED runner on the Rocky Linux 9 lab host, against the
#    natively installed, pinned Suricata and Wazuh. Register it with labels [self-hosted, rocky9, cc-lab].
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]   # 3.10 = floor in CLAUDE.md; 3.13 = VERIFY_X509_STRICT behaviour
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - name: lint
        run: |
          python -m py_compile cc/*.py agents/*.py scripts/*.py tests/*.py
          bash -n scripts/*.sh
          xmllint --noout wazuh/rules/cc_rules.xml
      - name: unit tests + rule-regex semantics
        run: for t in tests/test_core.py tests/test_teams.py tests/test_stack.py tests/test_rules_regex.py; do python -I "$t" || exit 1; done

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: playwright (pinned)
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: render, JS/Python score parity, degraded + outage modes
        run: node tests/render_dashboard.mjs

  engines:
    # Opt-in: only where the self-hosted Rocky runner exists (set repo variable CC_LAB_RUNNER=1).
    if: vars.CC_LAB_RUNNER == '1'
    runs-on: [self-hosted, rocky9, cc-lab]
    steps:
      - uses: actions/checkout@v4
      - name: suricata -T on the project rules (native, pinned)
        run: |
          sudo suricata -T -k none -S "$PWD/suricata/rules/local.rules" -v 2>&1 | tee suricata-T.log
          grep -q "0 rules failed" suricata-T.log
      - name: CC rules through the real Wazuh engine (native wazuh-logtest)
        run: |
          sudo rsync -a --delete wazuh/rules/ /var/ossec/etc/cc-rules/
          sudo /var/ossec/bin/wazuh-control restart
          python3 tests/rules_logtest.py

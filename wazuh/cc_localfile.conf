<!-- Appended to upstream wazuh_manager.conf by scripts/gen_manager_conf.py. Extra <ossec_config> blocks with
     <localfile> are additive (upstream itself uses two). NOTE: a second <ruleset> block is NOT additive: it replaces
     the default rule/decoder dirs (observed: "Total rules enabled: 0"), so gen_manager_conf.py inserts our
     <rule_dir> into upstream's existing <ruleset> instead.
     The manager's own logcollector reads Suricata EVE from a read-only mount: no host agent needed.
     <ignore>: Suricata "stats" records carry ~500 fields, over the JSON decoder's limit ("Too many fields"). -->
<ossec_config>
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/cc-suricata/eve.json</location>
    <ignore type="PCRE2">"event_type":"stats"</ignore>
  </localfile>
</ossec_config>

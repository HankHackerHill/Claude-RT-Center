# Layered over upstream wazuh-docker/single-node/docker-compose.yml by scripts/bootstrap.sh:
#   docker compose -f docker-compose.yml -f ../../wazuh/compose.override.yml ...
# Needs compose >= 2.24.4 for !override. CC_ROOT is exported by bootstrap.sh (absolute project path).
# What it changes vs upstream, and why:
#  - every published port bound to loopback (upstream binds 0.0.0.0 with well-known default credentials);
#    514/udp syslog dropped (unused). WAZUH_DASHBOARD_BIND lets you expose only the Wazuh UI to your LAN.
#  - ossec.conf = upstream + wazuh/cc_localfile.conf (generated into data/wazuh/ by bootstrap.sh)
#  - CC correlation rules: the wazuh/rules/ DIRECTORY bind-mounted read-only at /var/ossec/etc/cc-rules and added as a
#    <rule_dir> (cc_localfile.conf). A directory, not a file: single-file bind mounts pin the inode, so an editor that
#    saves by rename leaves the manager on stale rules (observed). Not via /wazuh-config-mount either: upstream
#    4.14.11's init exits before that copy on a plain container restart (multigroups re-install bug), so it only
#    applies when the container is (re)created. ossec.conf still uses it, so bootstrap.sh force-recreates the manager.
#  - Suricata's log dir mounted read-only so the manager's logcollector reads eve.json directly
#  - credentials: generated by scripts/gen_secrets.py into .env / data/wazuh/ before first boot (bootstrap passes
#    --env-file .env). The :? guards make compose refuse to start with an empty secret instead of a default.
services:
  wazuh.manager:
    ports: !override
      - "127.0.0.1:1514:1514"
      - "127.0.0.1:1515:1515"
      - "127.0.0.1:55000:55000"
    environment:
      - INDEXER_PASSWORD=${WAZUH_ADMIN_PASS:?run scripts/gen_secrets.py}
      - API_PASSWORD=${WAZUH_API_PASS:?run scripts/gen_secrets.py}
    volumes:
      - ${CC_ROOT:?export CC_ROOT}/data/wazuh/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ${CC_ROOT}/wazuh/rules:/var/ossec/etc/cc-rules:ro
      - ${CC_ROOT}/data/suricata/log:/var/log/cc-suricata:ro
  wazuh.indexer:
    ports: !override
      - "127.0.0.1:9200:9200"
    volumes:
      - ${CC_ROOT}/data/wazuh/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
  wazuh.dashboard:
    ports: !override
      - "${WAZUH_DASHBOARD_BIND:-127.0.0.1}:443:5601"
    environment:
      - INDEXER_PASSWORD=${WAZUH_ADMIN_PASS:?run scripts/gen_secrets.py}
      - DASHBOARD_PASSWORD=${WAZUH_KIBANASERVER_PASS:?run scripts/gen_secrets.py}
      - API_PASSWORD=${WAZUH_API_PASS:?run scripts/gen_secrets.py}
    volumes:
      - ${CC_ROOT}/data/wazuh/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml   # rw: the app may save settings
